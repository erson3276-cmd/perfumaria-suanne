<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" width="240" height="240">
  <g fill="none" stroke="#a8842f">
    <!-- Outer diamond frame -->
    <rect x="-62" y="-62" width="124" height="124" transform="rotate(45)" stroke-width="1.6" />
    <!-- Inner hairline diamond -->
    <rect x="-52" y="-52" width="104" height="104" transform="rotate(45)" stroke-width="0.7" />

    <!-- Vertex ticks -->
    <path d="M0 -96 L0 -88" stroke-width="1.4" />
    <path d="M96 0 L88 0" stroke-width="1.4" />
    <path d="M0 96 L0 88" stroke-width="1.4" />
    <path d="M-96 0 L-88 0" stroke-width="1.4" />

    <!-- Vertex dots -->
    <path d="M0 -91 L3 -87 L0 -83 L-3 -87 Z" fill="#a8842f" stroke="none" />
    <path d="M91 0 L87 -3 L83 0 L87 3 Z" fill="#a8842f" stroke="none" />
    <path d="M0 91 L3 87 L0 83 L-3 87 Z" fill="#a8842f" stroke="none" />
    <path d="M-91 0 L-87 -3 L-83 0 L-87 3 Z" fill="#a8842f" stroke="none" />

    <!-- Corner diamonds (diagonal mid-edges) -->
    <path d="M62 62 L66 66 L62 70 L58 66 Z" fill="#a8842f" stroke="none" />
    <path d="M62 -62 L66 -66 L62 -70 L58 -66 Z" fill="#a8842f" stroke="none" />
    <path d="M-62 62 L-66 66 L-62 70 L-58 66 Z" fill="#a8842f" stroke="none" />
    <path d="M-62 -62 L-66 -66 L-62 -70 L-58 -66 Z" fill="#a8842f" stroke="none" />

    <!-- Decorative curls top and bottom -->
    <path d="M0 -62 C 14 -64 22 -56 22 -46" stroke-width="0.9" />
    <path d="M0 62 C -14 64 -22 56 -22 46" stroke-width="0.9" />

    <!-- Monogram S -->
    <path
      d="M-22 -26 C -22 -41 -12 -47 0 -47 C 12 -47 22 -39 22 -25 C 22 -13 12 -7 0 -3 C -12 1 -22 7 -22 19 C -22 31 -12 39 0 39 C 12 39 22 31 22 21"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Baseline flourish -->
    <path d="M-16 52 C -8 57 8 57 16 52" stroke-width="0.9" />
    <path d="M-8 58 C -4 61 4 61 8 58" stroke-width="0.7" />
  </g>
</svg>
